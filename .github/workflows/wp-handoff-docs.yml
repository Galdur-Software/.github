# Reusable: build a site's handoff documents (guide, login sheet) with the calling repo's own command, shrink the
# PDFs with Ghostscript and keep them as an artifact.
#
# No secrets reach this workflow, on purpose: a document built here can only hold what is in the repo, and the repo
# holds no passwords. A login sheet built here has blank lines for passwords; the owner writes them in by hand.
#
#   jobs:
#     docs:
#       uses: Galdur-Software/.github/.github/workflows/wp-handoff-docs.yml@<sha> # v1
#       permissions:
#         contents: read
#       with:
#         command: python guide/build.py --out "$OUTPUT_DIR"
name: wp-handoff-docs

on:
  workflow_call:
    inputs:
      command:
        description: Shell command that writes the documents into $OUTPUT_DIR (Python venv with python-packages active)
        type: string
        required: true
      output-dir:
        description: Folder the command writes to; uploaded as the artifact
        type: string
        default: handoff
      python-packages:
        description: Space-separated pip requirements for the command
        type: string
        default: playwright==1.64.0 pillow
      python-version:
        description: Python version
        type: string
        default: "3.12"
      compress:
        description: Shrink each PDF with Ghostscript (/ebook, 150 dpi images) when that makes it smaller
        type: boolean
        default: true
      artifact-name:
        description: Name of the documents artifact
        type: string
        default: handoff-docs
      retention-days:
        description: Days to keep the documents (PDFs are large; private repos have little artifact storage)
        type: number
        default: 14

permissions: {}

jobs:
  docs:
    name: handoff documents
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install tools
        env:
          PYTHON_PACKAGES: ${{ inputs.python-packages }}
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghostscript poppler-utils >/dev/null
          uv venv "$RUNNER_TEMP/venv" --python "$PYTHON_VERSION"
          read -ra pkgs <<<"$PYTHON_PACKAGES"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "${pkgs[@]}"
          if [ -x "$RUNNER_TEMP/venv/bin/playwright" ]; then
            "$RUNNER_TEMP/venv/bin/python" -m playwright install --with-deps chromium
          fi

      - name: Build the documents
        env:
          COMMAND: ${{ inputs.command }}
          OUTPUT_DIR: ${{ inputs.output-dir }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          source "$RUNNER_TEMP/venv/bin/activate"
          bash -euo pipefail -c "$COMMAND"
          [ -n "$(find "$OUTPUT_DIR" -type f -print -quit)" ] || { echo "::error::Nothing was written to $OUTPUT_DIR"; exit 1; }

      - name: Shrink PDFs
        if: inputs.compress
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
        run: |
          find "$OUTPUT_DIR" -name '*.pdf' -print0 | while IFS= read -r -d '' pdf; do
            small="$RUNNER_TEMP/small.pdf"
            if gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pdfwrite -dCompatibilityLevel=1.6 -dPDFSETTINGS=/ebook \
                 -dColorImageResolution=150 -sOutputFile="$small" "$pdf" \
               && [ "$(stat -c %s "$small")" -lt "$(stat -c %s "$pdf")" ]; then
              mv -f "$small" "$pdf"
            fi
            rm -f "$small"
          done
          {
            echo "### Handoff documents"
            echo '```'
            (cd "$OUTPUT_DIR" && find . -type f -printf '%P  %k kB\n' | sort)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.output-dir }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
